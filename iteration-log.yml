summary:
  total_blocks: 1
  total_iterations: 3
  total_verification_redos: 3
  optimizer_invocations: 0
  escalations_to_user: 0
  lessons_learned:
    - Integer output precision can hide successful analog weight calibration.
    - P/N averaging is not a valid physical upper-bound oracle under independent mismatch.
    - More averaging cannot repair a codebook with negative carry margin.
    - Behavioral completion and full specification sign-off must be reported separately.
    - Redundancy must be checked per target against local backend range, not only as total extra capacitance.
    - Code-density static metrics and formal local monotonicity are distinct acceptance claims.
