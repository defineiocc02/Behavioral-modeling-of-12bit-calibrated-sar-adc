<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#005288"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#c82423"/>
    </marker>
    <linearGradient id="analogGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F0FE"/><stop offset="100%" stop-color="#D0E0FA"/>
    </linearGradient>
    <linearGradient id="digitalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3E2"/><stop offset="100%" stop-color="#FDE8C8"/>
    </linearGradient>
    <linearGradient id="clockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/><stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="900" height="620" fill="#FAFBFC" rx="10"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#005288">12-bit 10-MS/s SAR ADC with CAAZ — System Architecture</text>

  <!-- ===== ANALOG DOMAIN ===== -->
  <rect x="20" y="45" width="520" height="310" rx="8" fill="none" stroke="#005288" stroke-width="1.5" stroke-dasharray="8,3"/>
  <text x="30" y="62" font-size="10" font-weight="bold" fill="#005288">Analog Domain (AVDD=1.8V)</text>

  <!-- Input -->
  <rect x="35" y="75" width="100" height="55" rx="6" fill="url(#analogGrad)" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="85" y="93" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">VIN / VIP</text>
  <text x="85" y="107" text-anchor="middle" font-size="8" fill="#64748B">Diff. Input</text>
  <text x="85" y="120" text-anchor="middle" font-size="7" fill="#94A3B8">890 mVpp-diff</text>

  <!-- Sampling Switch -->
  <rect x="165" y="75" width="95" height="55" rx="6" fill="url(#analogGrad)" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="212" y="93" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E40AF">Bootstrapped</text>
  <text x="212" y="106" text-anchor="middle" font-size="9" font-weight="bold" fill="#1E40AF">Switch</text>
  <text x="212" y="120" text-anchor="middle" font-size="7" fill="#94A3B8">Ron &lt; 400Ω</text>

  <!-- CDAC -->
  <rect x="290" y="70" width="120" height="65" rx="6" fill="url(#analogGrad)" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="350" y="88" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">CDAC</text>
  <text x="350" y="102" text-anchor="middle" font-size="8" fill="#475569">Split-DAC</text>
  <text x="350" y="114" text-anchor="middle" font-size="7" fill="#94A3B8">Cunit = 5 fF</text>
  <text x="350" y="126" text-anchor="middle" font-size="7" fill="#94A3B8">12+1 bit redundancy</text>

  <!-- CAAZ Preamp -->
  <rect x="440" y="70" width="85" height="65" rx="6" fill="url(#analogGrad)" stroke="#005288" stroke-width="2"/>
  <text x="482" y="86" text-anchor="middle" font-size="9" font-weight="bold" fill="#005288">CAAZ ⭐</text>
  <text x="482" y="99" text-anchor="middle" font-size="8" font-weight="bold" fill="#005288">Preamp</text>
  <text x="482" y="112" text-anchor="middle" font-size="7" fill="#475569">Caz=300fF</text>
  <text x="482" y="124" text-anchor="middle" font-size="7" fill="#475569">gmp×Roa&gt;50</text>

  <!-- Arrows: Input → Switch → CDAC → Preamp -->
  <line x1="135" y1="102" x2="162" y2="102" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="260" y1="102" x2="287" y2="102" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="410" y1="102" x2="437" y2="102" stroke="#005288" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- CDAC labels -->
  <text x="350" y="150" text-anchor="middle" font-size="7" fill="#94A3B8">N</text>
  <text x="375" y="150" text-anchor="middle" font-size="7" fill="#94A3B8">P</text>

  <!-- StrongARM -->
  <rect x="440" y="155" width="85" height="50" rx="6" fill="url(#analogGrad)" stroke="#10B981" stroke-width="1.2"/>
  <text x="482" y="172" text-anchor="middle" font-size="9" font-weight="bold" fill="#047857">StrongARM</text>
  <text x="482" y="186" text-anchor="middle" font-size="8" fill="#475569">Latch</text>
  <text x="482" y="198" text-anchor="middle" font-size="7" fill="#94A3B8">regen &lt; 0.3ns</text>

  <!-- Preamp → StrongARM -->
  <line x1="482" y1="135" x2="482" y2="152" stroke="#10B981" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- CDAC feedback lines (BITP/BITN) -->
  <path d="M 350,136 L 350,230 L 290,230 L 290,155 L 290,136" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="320" y="222" text-anchor="middle" font-size="7" fill="#D97706">BITP/N</text>

  <!-- ===== DIGITAL DOMAIN ===== -->
  <rect x="20" y="215" width="520" height="140" rx="8" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="8,3"/>
  <text x="30" y="232" font-size="10" font-weight="bold" fill="#D97706">Digital Domain (DVDD=1.8V)</text>

  <!-- SAR_LOGIC -->
  <rect x="120" y="245" width="140" height="70" rx="6" fill="url(#digitalGrad)" stroke="#D97706" stroke-width="1.5"/>
  <text x="190" y="263" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">SAR_LOGIC</text>
  <text x="190" y="278" text-anchor="middle" font-size="8" fill="#78350F">13-bit Ring-Counter</text>
  <text x="190" y="292" text-anchor="middle" font-size="7" fill="#92400E">Token-Passing DFF Chain</text>
  <text x="190" y="306" text-anchor="middle" font-size="7" fill="#B45309">SET&lt;12:0&gt; · ST&lt;12:0&gt;</text>

  <!-- DEC -->
  <rect x="290" y="250" width="80" height="55" rx="6" fill="url(#digitalGrad)" stroke="#D97706" stroke-width="1.2"/>
  <text x="330" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">DEC</text>
  <text x="330" y="286" text-anchor="middle" font-size="8" fill="#78350F">Output</text>
  <text x="330" y="298" text-anchor="middle" font-size="7" fill="#B45309">B&lt;11:0&gt;</text>

  <!-- StrongARM → SAR_LOGIC (COMN) -->
  <path d="M 440,180 L 70,180 L 70,280 L 117,280" fill="none" stroke="#10B981" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="56" y="230" text-anchor="middle" font-size="7" fill="#64748B" transform="rotate(-90,56,230)">COMN</text>

  <!-- SAR_LOGIC → DEC -->
  <line x1="260" y1="275" x2="287" y2="275" stroke="#D97706" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- SAR_LOGIC → CDAC (BITP/BITN + SET) -->
  <text x="105" y="260" font-size="7" fill="#D97706">BITP/N &lt;12:0&gt;</text>

  <!-- ===== CLOCK DOMAIN ===== -->
  <rect x="555" y="45" width="180" height="310" rx="8" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="8,3"/>
  <text x="565" y="62" font-size="10" font-weight="bold" fill="#16A34A">Clock Domain</text>

  <!-- CLK00 -->
  <rect x="580" y="75" width="130" height="40" rx="6" fill="url(#clockGrad)" stroke="#16A34A" stroke-width="1.2"/>
  <text x="645" y="90" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">CLK00</text>
  <text x="645" y="106" text-anchor="middle" font-size="8" fill="#15803D">10 MHz Master</text>

  <!-- SYNC -->
  <rect x="580" y="130" width="130" height="55" rx="6" fill="url(#clockGrad)" stroke="#16A34A" stroke-width="1.5"/>
  <text x="645" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">SYNC</text>
  <text x="645" y="163" text-anchor="middle" font-size="8" fill="#15803D">NAND-Ring Pulse Gen</text>
  <text x="645" y="178" text-anchor="middle" font-size="7" fill="#16A34A">tdel = 4.5 ns</text>

  <!-- CLK00 → SYNC -->
  <line x1="645" y1="115" x2="645" y2="127" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- CCLK → SAR_LOGIC -->
  <text x="650" y="200" text-anchor="middle" font-size="8" fill="#16A34A">CCLK</text>
  <path d="M 580,155 L 270,155 L 270,242" fill="none" stroke="#16A34A" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="430" y="148" text-anchor="middle" font-size="7" fill="#16A34A">→ SAR_LOGIC</text>

  <!-- CLK → CAAZ Preamp -->
  <text x="660" y="220" text-anchor="middle" font-size="8" fill="#16A34A">CLK</text>
  <path d="M 710,158 L 740,158 L 740,102 L 528,102" fill="none" stroke="#16A34A" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="630" y="90" text-anchor="middle" font-size="7" fill="#16A34A">→ CAAZ Preamp</text>

  <!-- ===== TEST SETUP ===== -->
  <rect x="555" y="360" width="180" height="180" rx="8" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="8,3"/>
  <text x="565" y="378" font-size="10" font-weight="bold" fill="#DC2626">Test / Characterization</text>

  <!-- NF Inject -->
  <rect x="580" y="390" width="130" height="60" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="645" y="408" text-anchor="middle" font-size="9" font-weight="bold" fill="#991B1B">Noise Injection</text>
  <text x="645" y="423" text-anchor="middle" font-size="8" fill="#DC2626">NF=1 (baseline)</text>
  <text x="645" y="438" text-anchor="middle" font-size="8" fill="#DC2626">NF=10 (100× noise)</text>

  <!-- Injection switches -->
  <rect x="580" y="465" width="60" height="35" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="610" y="480" text-anchor="middle" font-size="8" fill="#991B1B">I1: Clock</text>
  <text x="610" y="493" text-anchor="middle" font-size="7" fill="#DC2626">Chain</text>
  <rect x="650" y="465" width="60" height="35" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="680" y="480" text-anchor="middle" font-size="8" fill="#991B1B">I14: Samp.</text>
  <text x="680" y="493" text-anchor="middle" font-size="7" fill="#DC2626">Switch</text>

  <!-- NF → Clock chain / Sampling switch labels -->
  <path d="M 610,465 L 610,200" fill="none" stroke="#DC2626" stroke-width="0.8" stroke-dasharray="4,3"/>
  <path d="M 680,465 L 680,100" fill="none" stroke="#DC2626" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Cross-batch validation box -->
  <rect x="580" y="510" width="130" height="25" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="0.8"/>
  <text x="645" y="527" text-anchor="middle" font-size="9" fill="#991B1B">Dual-Batch CSV Cross-Validation</text>

  <!-- ===== FOOTER LEGEND ===== -->
  <rect x="20" y="580" width="860" height="35" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
  <text x="35" y="598" font-size="8" fill="#64748B">⭐ CAAZ = Current-Adjusting Auto-Zeroing</text>
  <text x="35" y="609" font-size="8" fill="#64748B">TSMC 180nm 1P6M · 1.8V · Cadence Spectre 23.1 APS · HUST-SAR-2026-003</text>
  <text x="500" y="598" font-size="8" fill="#64748B">▬ Analog</text>
  <text x="560" y="598" font-size="8" fill="#64748B">▬ Digital</text>
  <text x="620" y="598" font-size="8" fill="#64748B">▬ Clock</text>
  <text x="670" y="598" font-size="8" fill="#64748B">▬ Test</text>
</svg>
