project: sar_adc_0716_cdac_calibration
started: 2026-07-17
effort: intensive
eda_mode: full
architecture: frame-synchronous foreground physical-CDAC weight reconstruction

iterations:
  - id: freeze_and_map
    status: pass
    evidence:
      - source_ro/SHA256SUMS.txt
      - results/switch_cdac_map/spectre.out
    finding: SWITCH physical stage mapping is correct for C12 through C1.

  - id: decoder_bus_order
    status: fixed
    evidence:
      - results/dec_onehot/vm_original/summary.txt
      - results/dec_onehot/0716_corrected/summary.txt
    finding: Deployed generic DEC reversed BP13-to-BP0 for the 0716 PN buffer.

  - id: comparator_frame_timing
    status: fixed
    evidence:
      - results/com_iaz_timing/spectre.out
    finding: COM_IAZ holds stale outputs during reset; calibration now captures only eight valid decisions per frame.

  - id: calibration_endpoint_v1
    status: fail
    evidence:
      - results/calibration_cdac_ideal/calibration_summary.json
    finding: Exact equality at the final C1 trial was deterministically rejected, recursively lowering C8/C9/CR and all walls.

  - id: calibration_endpoint_v2
    status: pass
    evidence:
      - results/calibration_cdac_ideal_v2/calibration_summary.json
    finding: A 2-LSB nominal deadband plus deterministic-only bin midpoint recovered C8-C11 and measured C12 as 2053 LSB.

  - id: redundancy_center_and_overdrive
    status: fixed
    evidence:
      - results/full_adc_bypass_debug2u/exports
      - results/full_adc_bypass/analysis/metrics.json
      - results/full_adc_bypass_debug2u_800m/exports
    finding: Raw non-binary sum needs half-excess center subtraction; the frozen 890-mV input also overdrives the redundancy-reduced range.

  - id: full_dynamic_ab
    status: pass
    evidence:
      - results/full_adc_bypass_800m
      - results/full_adc_frame_cal_800m
    finding: Calibration completed at 9.60011 us with ERR=0; SNDR improved from 61.48 dB to 73.60 dB and SFDR from 65.07 dB to 83.99 dB on matched 128-point coherent windows.

  - id: latest_netlist_refresh
    status: pass
    evidence:
      - source_ro/input_Interactive294_NF10_noise_test.scs
      - results/latest_ade_deadband2_noop/calibration_summary.json
    finding: Interactive.294 changed C12/C11/C10 to differential-average physical weights 2053.805632, 1027.820352, and 513.122560 LSB; the deployed 2-LSB global deadband suppressed the measured 1.875-LSB C11 correction.

  - id: split_update_deadband
    status: fixed
    evidence:
      - variants/DEC_CAL_PHY_FRAME_SYNC.va
      - results/theory_latest_890m_norm/theory_metrics.json
    finding: C8/C9/CR retain the 2-LSB endpoint-protection deadband, while C10/C11/C12 use a 1-LSB deadband; dynamic total-weight normalization is enabled by default for drop-in deployment.

  - id: fullscale_matched_noise_ab
    status: pass
    evidence:
      - results/full_adc_latest_bypass_890m_norm_nf100k_matched_cx/analysis/metrics.json
      - results/full_adc_latest_frame_cal_890m_norm_nf100k_matched_cx/analysis/metrics.json
      - results/full_adc_latest_frame_cal_890m_norm_nf100k_matched_cx/calibration_summary.json
    finding: At va=890m with identical 10.098505-22.798505 us sampling and 100 kHz-10 GHz transient-noise settings, calibration completed at 9.60011 us with ERR=0; SNDR improved 66.62 to 68.45 dB, SFDR 71.45 to 78.78 dB, and THD -70.26 to -76.69 dBc. The calibrated SNR of 69.16 dB, rather than residual mismatch, is the main reason SNDR cannot reach 73 dB in NF10.

  - id: deploy_verified_decoder
    status: pass
    evidence:
      - results/dec_range_norm_deploy_regression/spectre.out
      - variants/DEC_CAL_PHY_FRAME_SYNC.va
    finding: Endpoint regression returned codes 0 and 4095 with zero errors/warnings; VM DEC was atomically replaced with SHA-256 048f7540f3ff after preserving the prior 62f4d30d8e36 file as veriloga.va.backup_20260718_130847. SWITCH, COM_IAZ, CDAC, and OA data were unchanged.
