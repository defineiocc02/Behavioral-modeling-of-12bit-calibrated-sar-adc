name: Python behavioral model

on:
  push:
    paths:
      - "src/python_cal/**"
      - "docs/figures/**"
      - "evidence/mismatch_matrix/**"
      - "scripts/generate_report_*.py"
      - "scripts/report_figure_support.py"
      - "requirements/report-render-py313.txt"
      - "pyproject.toml"
      - ".github/workflows/python-model.yml"
  pull_request:
    paths:
      - "src/python_cal/**"
      - "docs/figures/**"
      - "evidence/mismatch_matrix/**"
      - "scripts/generate_report_*.py"
      - "scripts/report_figure_support.py"
      - "requirements/report-render-py313.txt"
      - "pyproject.toml"
      - ".github/workflows/python-model.yml"

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements/report-render-py313.txt

      - name: Install model and documentation dependencies
        run: >-
          python -m pip install
          -c requirements/report-render-py313.txt
          -e ".[dev,docs]"

      - name: Record rendering toolchain
        run: |
          python --version
          python - <<'PY'
          import matplotlib
          import numpy
          from PIL import Image
          from matplotlib import font_manager

          print(f"matplotlib={matplotlib.__version__}")
          print(f"numpy={numpy.__version__}")
          print(f"pillow={Image.__version__}")
          print("font=" + font_manager.findfont("DejaVu Sans", fallback_to_default=False))
          PY

      - name: Run regression tests
        run: python -m pytest

      - name: Render current mismatch-report figures
        run: |
          python scripts/generate_report_figures.py --matrix-root evidence/mismatch_matrix
          python scripts/generate_report_metrics.py

      - name: Verify report artifacts and English figure internals
        run: |
          # Vector deliverables and metrics are byte-canonical across platforms.
          # PNG anti-aliasing bytes are OS-dependent, so validate their decoded
          # structure while the exact SVG/PDF gates protect figure semantics.
          git diff --exit-code -- \
            ':(glob)docs/figures/mismatch_report/*.svg' \
            ':(glob)docs/figures/mismatch_report/*.pdf' \
            docs/generated_metrics.tex
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import subprocess

          from PIL import Image

          roots = [Path("scripts/generate_report_figures.py")]
          roots.extend(Path("docs/figures/mismatch_report").glob("*.svg"))
          cjk_ranges = ((0x3400, 0x9FFF), (0xF900, 0xFAFF))
          offenders = []
          for path in roots:
              text = path.read_text(encoding="utf-8")
              if any(lo <= ord(char) <= hi for char in text for lo, hi in cjk_ranges):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit("CJK text found inside report figures: " + ", ".join(offenders))

          outputs = list(Path("docs/figures/mismatch_report").glob("*.*"))
          if len(outputs) != 21:
              raise SystemExit(f"expected 21 current figure files, found {len(outputs)}")

          pngs = sorted(Path("docs/figures/mismatch_report").glob("*.png"))
          if len(pngs) != 7:
              raise SystemExit(f"expected 7 PNG previews, found {len(pngs)}")
          for path in pngs:
              committed = subprocess.check_output(
                  ["git", "show", f"HEAD:{path.as_posix()}"]
              )
              with Image.open(BytesIO(committed)) as baseline, Image.open(path) as rendered:
                  baseline.load()
                  rendered.load()
                  if rendered.size != baseline.size or rendered.mode != baseline.mode:
                      raise SystemExit(
                          f"PNG structure changed for {path}: "
                          f"{baseline.size}/{baseline.mode} -> {rendered.size}/{rendered.mode}"
                      )
          PY

      - name: Upload rendered figures
        uses: actions/upload-artifact@v4
        with:
          name: mismatch-report-figures
          path: |
            docs/figures/mismatch_report
            docs/generated_metrics.tex
